<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
  <!-- background -->
  <rect width="640" height="400" fill="#1a0a00"/>

  <!-- top accent bar -->
  <rect width="640" height="6" fill="#f97316"/>

  <!-- product icon area -->
  <rect x="24" y="28" width="120" height="120" rx="12" fill="#f9731622"/>
  <g transform="translate(60, 64) scale(2)" fill="#f97316">
    <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/>
  </g>

  <!-- badge -->
  <rect x="156" y="28" width="128" height="26" rx="5" fill="#f9731633"/>
  <text x="166" y="46" font-size="12" font-weight="700" fill="#f97316" font-family="monospace" letter-spacing="1">SAFETY / PPE</text>

  <!-- product name -->
  <text x="156" y="78" font-size="20" font-weight="700" fill="#f1f5f9" font-family="sans-serif">Full-Body Safety Harness (ANSI Z</text>
  <text x="156" y="106" font-size="17" font-weight="400" fill="#f1f5f9" font-family="sans-serif">359)</text>

  <!-- divider -->
  <line x1="24" y1="170" x2="616" y2="170" stroke="#f9731644" stroke-width="1"/>

  <!-- specs header -->
  <text x="32" y="205" font-size="11" font-weight="600" fill="#f9731699" font-family="monospace" letter-spacing="1">TECHNICAL SPECIFICATIONS</text>

  <!-- specs rows -->
  <text x="32" y="228" font-size="13" fill="#94a3b8">ANSI / OSHA certified</text>
    <text x="32" y="250" font-size="13" fill="#94a3b8">High-visibility class 2</text>
    <text x="32" y="272" font-size="13" fill="#94a3b8">Impact resistant shell</text>
    <text x="32" y="294" font-size="13" fill="#94a3b8">Adjustable fit system</text>

  <!-- bottom note -->
  <rect x="0" y="370" width="640" height="30" fill="#f9731611"/>
  <text x="32" y="389" font-size="11" fill="#475569" font-family="sans-serif">Reference image for procurement sourcing — actual product may vary</text>

  <!-- border -->
  <rect x="1" y="1" width="638" height="398" rx="4" fill="none" stroke="#f9731633" stroke-width="1.5"/>
</svg>