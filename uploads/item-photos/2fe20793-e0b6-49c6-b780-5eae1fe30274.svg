<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
  <!-- background -->
  <rect width="640" height="400" fill="#111827"/>

  <!-- top accent bar -->
  <rect width="640" height="6" fill="#64748b"/>

  <!-- product icon area -->
  <rect x="24" y="28" width="120" height="120" rx="12" fill="#64748b22"/>
  <g transform="translate(60, 64) scale(2)" fill="#64748b">
    <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
  </g>

  <!-- badge -->
  <rect x="156" y="28" width="164" height="26" rx="5" fill="#64748b33"/>
  <text x="166" y="46" font-size="12" font-weight="700" fill="#64748b" font-family="monospace" letter-spacing="1">MOUNTING / CIVIL</text>

  <!-- product name -->
  <text x="156" y="78" font-size="20" font-weight="700" fill="#f1f5f9" font-family="sans-serif">Wall-mount Network Enclosure (12</text>
  <text x="156" y="106" font-size="17" font-weight="400" fill="#f1f5f9" font-family="sans-serif">U)</text>

  <!-- divider -->
  <line x1="24" y1="170" x2="616" y2="170" stroke="#64748b44" stroke-width="1"/>

  <!-- specs header -->
  <text x="32" y="205" font-size="11" font-weight="600" fill="#64748b99" font-family="monospace" letter-spacing="1">TECHNICAL SPECIFICATIONS</text>

  <!-- specs rows -->
  <text x="32" y="228" font-size="13" fill="#94a3b8">Galvanized steel</text>
    <text x="32" y="250" font-size="13" fill="#94a3b8">Hot-dip zinc coated</text>
    <text x="32" y="272" font-size="13" fill="#94a3b8">Rated for 60kg load</text>
    <text x="32" y="294" font-size="13" fill="#94a3b8">Pre-drilled mounting holes</text>

  <!-- bottom note -->
  <rect x="0" y="370" width="640" height="30" fill="#64748b11"/>
  <text x="32" y="389" font-size="11" fill="#475569" font-family="sans-serif">Reference image for procurement sourcing — actual product may vary</text>

