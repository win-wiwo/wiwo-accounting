<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
  <!-- background -->
  <rect width="640" height="400" fill="#0f172a"/>

  <!-- top accent bar -->
  <rect width="640" height="6" fill="#0ea5e9"/>

  <!-- product icon area -->
  <rect x="24" y="28" width="120" height="120" rx="12" fill="#0ea5e922"/>
  <g transform="translate(60, 64) scale(2)" fill="#0ea5e9">
    <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14l-5-5 1.41-1.41L12 14.17l7.59-7.59L21 8l-9 9z"/>
  </g>

  <!-- badge -->
  <rect x="156" y="28" width="101" height="26" rx="5" fill="#0ea5e933"/>
  <text x="166" y="46" font-size="12" font-weight="700" fill="#0ea5e9" font-family="monospace" letter-spacing="1">EQUIPMENT</text>

  <!-- product name -->
  <text x="156" y="78" font-size="20" font-weight="700" fill="#f1f5f9" font-family="sans-serif">Canva Teams Plan – 10 seats (ann</text>
  <text x="156" y="106" font-size="17" font-weight="400" fill="#f1f5f9" font-family="sans-serif">ual)</text>

  <!-- divider -->
  <line x1="24" y1="170" x2="616" y2="170" stroke="#0ea5e944" stroke-width="1"/>

  <!-- specs header -->
  <text x="32" y="205" font-size="11" font-weight="600" fill="#0ea5e999" font-family="monospace" letter-spacing="1">TECHNICAL SPECIFICATIONS</text>

  <!-- specs rows -->
  <text x="32" y="228" font-size="13" fill="#94a3b8">Industrial grade</text>
    <text x="32" y="250" font-size="13" fill="#94a3b8">CE / UL certified</text>
    <text x="32" y="272" font-size="13" fill="#94a3b8">2-year warranty</text>
    <text x="32" y="294" font-size="13" fill="#94a3b8">Local support available</text>

  <!-- bottom note -->
  <rect x="0" y="370" width="640" height="30" fill="#0ea5e911"/>
  <text x="32" y="389" font-size="11" fill="#475569" font-family="sans-serif">Reference image for procurement sourcing — actual product may vary</text>

  <!-- border -->
  <rect x="1" y="1" width="638" height="398" rx="4" fill="none" stroke="#0ea5e933" stroke-width="1.5"/>
</svg>